<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween VIP - Casa de Nilton</title>
    <!-- Importamos la librería para generar códigos QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b071e;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Fondo de mansión embrujada con luna brillante */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, #ff5722 0%, #1a0b2e 50%, #05020a 100%);
            z-index: -1;
        }

        /* Textos diagonales temáticos */
        .diagonal-text {
            position: absolute;
            font-size: 2rem;
            font-weight: bold;
            color: rgba(255, 140, 0, 0.2);
            text-transform: uppercase;
            pointer-events: none;
            white-space: nowrap;
        }

        .left-diagonal-text {
            top: 25%;
            left: 5%;
            transform: rotate(-25deg);
        }

        .right-diagonal-text {
            top: 25%;
            right: 5%;
            transform: rotate(25deg);
        }

        /* Contenedor principal de la tarjeta de invitación */
        .invitation-card {
            background: rgba(15, 10, 30, 0.85);
            border: 2px solid #ff7b00;
            box-shadow: 0 0 25px rgba(255, 123, 0, 0.5);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            z-index: 10;
        }

        h1 {
            color: #ff7b00;
            text-shadow: 0 0 10px #ff4500;
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        .event-details {
            color: #b19cd9;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 80%;
            padding: 10px;
            background: #1a1236;
            border: 1px solid #ff7b00;
            color: #fff;
            border-radius: 5px;
            text-align: center;
            font-size: 1rem;
            margin-bottom: 15px;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: #7a6c9e;
        }

        button {
            background-color: #ff7b00;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }

        button:hover {
            background-color: #ff4500;
            box-shadow: 0 0 15px #ff4500;
            color: #fff;
        }

        /* Sección del Pase VIP Oculto al inicio */
        #vip-pass {
            margin-top: 20px;
            border-top: 1px dashed #ff7b00;
            padding-top: 15px;
            display: none;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            background: #fff;
            padding: 10px;
            border-radius: 5px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        /* Logo personalizado esquina inferior izquierda */
        .bottom-left-logo {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #ff7b00;
            padding: 5px 10px;
            border-radius: 8px;
            z-index: 5;
        }

        .ph-black {
            background-color: #000;
            color: #fff;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 4px;
        }

        .ph-orange {
            background-color: #ff7b00;
            color: #000;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 4px;
            margin-left: 2px;
        }

        /* --- AJUSTES RESPONSIVOS PARA CELULARES --- */
        @media (max-width: 768px) {
            .left-diagonal-text, .right-diagonal-text {
                font-size: 1.1rem !important;
            }
            .left-diagonal-text {
                top: 12% !important;
                left: 2% !important;
            }
            .right-diagonal-text {
                top: 12% !important;
                right: 2% !important;
            }
            .bottom-left-logo {
                bottom: 10px !important;
                left: 10px !important;
                transform: scale(0.8);
            }
        }
    </style>
</head>
<body>

    <!-- Fondo tenebroso -->
    <div class="background-container"></div>

    <!-- Textos diagonales -->
    <div class="diagonal-text left-diagonal-text">YA KCHE YA!!!</div>
    <div class="diagonal-text right-diagonal-text">MECATRONICOS!!!</div>

    <!-- Tarjeta central -->
    <div class="invitation-card">
        <h1>🎃 CASA DE NILTON 🎃</h1>
        <div class="event-details">
            <p><strong>Fecha:</strong> 31 de Octubre</p>
            <p><strong>Hora:</strong> 11:00 PM</p>
            <p>Ingresa tu nombre para generar tu pase de acceso VIP:</p>
        </div>

        <!-- Formulario interactivo -->
        <form id="invite-form">
            <input type="text" id="nombre" name="nombre" placeholder="Tu Nombre y Apellido" required autocomplete="off">
            <br>
            <button type="submit">Generar Pase VIP</button>
        </form>

        <!-- Pase VIP generado con QR -->
        <div id="vip-pass">
            <h3 style="color: #ff7b00; margin: 5px 0;">✨ PASE VIP AUTORIZADO ✨</h3>
            <p>Invitado: <span id="display-name" style="color: #fff; font-weight: bold;"></span></p>
            <div id="qrcode"></div>
            <p style="font-size: 0.8rem; color: #a593d0; margin-top: 10px;">Presenta este código en la puerta.</p>
        </div>
    </div>

    <!-- Logo temático inferior izquierdo -->
    <div class="bottom-left-logo">
        <span class="ph-black">CASA</span><span class="ph-orange">NILTON</span>
    </div>

    <!-- Script para generar el QR dinámicamente -->
    <script>
        const form = document.getElementById('invite-form');
        const vipPass = document.getElementById('vip-pass');
        const displayName = document.getElementById('display-name');
        const qrContainer = document.getElementById('qrcode');

        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que la página se recargue
            const nombreInput = document.getElementById('nombre').value.trim();
            
            if (nombreInput !== "") {
                displayName.textContent = nombreInput;
                vipPass.style.display = "block";
                
                // Limpiamos QR anterior si ya existía
                qrContainer.innerHTML = "";
                
                // Generamos el nuevo QR con el nombre del invitado
                new QRCode(qrContainer, {
                    text: "VIP PASS: " + nombreInput + " - Casa de Nilton (31 Oct)",
                    width: 128,
                    height: 128,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            }
        });
    </script>
</body>
</html>
